name: mobilemonitor
description: Alephium wallet monitor for mobile.
publish_to: none

version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  connectivity_plus: ^6.1.3
  http: ^1.2.2
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  fl_chart: ^0.67.0

dev_dependencies:
  flutter_lints: ^4.0.0
  test: ^1.25.8
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
